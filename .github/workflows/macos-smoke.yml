name: macos-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "config/**"
      - "scripts/**"
      - "templates/**"
      - ".agents/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "config/**"
      - "scripts/**"
      - "templates/**"
      - ".agents/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify immutable action pins
        run: python3 scripts/check-action-pins.py
      - name: Parse shell scripts
        run: |
          for file in scripts/*.sh; do
            sh -n "$file"
          done
      - name: Run shell contract suites
        run: |
          sh scripts/test-bootstrap.sh
          sh scripts/test-contract.sh
          sh scripts/test-agent-setup.sh
          sh scripts/test-skills.sh
      # Defect 147 was macOS-only and invisible to every job we ran: .ps1 files
      # are checked out as CRLF everywhere, so a here-string in a PowerShell
      # test wrote a shell script whose shebang did not resolve. Only running
      # the PowerShell suite on macOS can catch that class again.
      - name: Run the PowerShell bootstrap suite on macOS
        shell: pwsh
        run: ./scripts/test-bootstrap.ps1
      - name: Run Python contract suites
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 scripts/test-validator.py
          python3 scripts/test-promotion-candidates.py
          python3 scripts/test-agent-sync.py
          python3 scripts/test-migration-planner.py
          python3 scripts/test-supply-chain.py
          python3 scripts/test-standardize-existing-project.py
          python3 scripts/test-compress-project.py
          python3 scripts/test-best-practices-contract.py
          python3 scripts/test-best-practices-manifest.py
          python3 scripts/test-standard-metrics.py
          python3 scripts/test-check-skills.py
          python3 scripts/test-artifacts-ledger.py
          python3 scripts/test-payload-classes.py
          python3 scripts/test-capability-artifacts.py
          python3 scripts/test-preset-core.py
          python3 scripts/test-release-manifest.py
          python3 scripts/test-one-c-scaffold.py
          python3 scripts/test-1c-clients.py
          python3 scripts/test-1c-source.py
          python3 scripts/test-1c-setup.py
          python3 scripts/test-1c-provider.py
          python3 scripts/test-1c-yaxunit.py
          python3 scripts/test-transcribe.py
          python3 scripts/test-1c-readiness.py
          python3 scripts/test-no-secrets.py
          python3 scripts/validate-project.py --root . --kind rules --report-only
