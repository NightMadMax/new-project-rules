name: macos-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "config/**"
      - "scripts/**"
      - "templates/**"
      - ".agents/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "config/**"
      - "scripts/**"
      - "templates/**"
      - ".agents/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify immutable action pins
        run: python3 scripts/check-action-pins.py
      - name: Parse shell scripts
        run: |
          for file in scripts/*.sh; do
            sh -n "$file"
          done
      - name: Run shell contract suites
        run: |
          sh scripts/test-bootstrap.sh
          sh scripts/test-contract.sh
          sh scripts/test-agent-setup.sh
          sh scripts/test-skills.sh
      # Defect 147 was macOS-only and invisible to every job we ran: .ps1 files
      # are checked out as CRLF everywhere, so a here-string in a PowerShell
      # test wrote a shell script whose shebang did not resolve. Only running
      # the PowerShell suite on macOS can catch that class again.
      - name: Run the PowerShell bootstrap suite on macOS
        shell: pwsh
        run: ./scripts/test-bootstrap.ps1
      - name: Run Python contract suites
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 scripts/run-test-suites.py
          python3 scripts/validate-project.py --root . --kind rules --report-only
