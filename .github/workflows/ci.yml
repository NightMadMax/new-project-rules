name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # TOOLS.md and MIN_PYTHON declare 3.9 as the supported minimum, and until
      # this step every job ran whatever the runner shipped (3.12+). A construct
      # newer than the declared floor would have passed CI and failed only on a
      # user's machine. The other jobs deliberately keep the runner default, so
      # both ends of the supported range are exercised.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.9"
      - name: Verify immutable action pins
        run: python3 scripts/check-action-pins.py
      - name: Lint shell scripts
        run: |
          for f in scripts/*.sh; do
            echo "sh -n $f"
            sh -n "$f"
          done
      - name: Bootstrap regression test
        run: sh scripts/test-bootstrap.sh
      - name: Project contract parity test
        run: sh scripts/test-contract.sh
      - name: Validator regression test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/run-test-suites.py
      - name: Validator report
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 scripts/validate-project.py --root . --kind rules --report-only
          python3 scripts/sync_global_agents.py --check --report-only
          python3 scripts/plan_migration.py --plan --target global --report-only
      - name: Agent setup smoke test
        run: sh scripts/test-agent-setup.sh
      - name: Agent skill contract test
        run: sh scripts/test-skills.sh

  # The Python suites, split across runners. On Windows this set took eleven
  # minutes as one queue while the same work on Ubuntu takes ninety seconds:
  # every heavy suite runs a full bootstrap, and process creation is expensive
  # there. Splitting attacks the wall clock, which no per-test change can.
  windows-suite:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validator regression test on Windows
        shell: powershell
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        # The runner returns a single exit code for the whole shard, so the
        # trap the old hand-written loop worked around — PowerShell not stopping
        # on a failing native command — cannot come back.
        run: python .\scripts\run-test-suites.py --shard ${{ matrix.shard }} --of 3

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify immutable action pins
        shell: powershell
        run: python .\scripts\check-action-pins.py
      - name: Parse-check PowerShell scripts with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-powershell-syntax.ps1
      - name: Parse-check PowerShell scripts with PowerShell 7
        shell: pwsh
        run: .\scripts\test-powershell-syntax.ps1
      - name: Validator report on Windows
        shell: powershell
        run: |
          $env:PYTHONDONTWRITEBYTECODE = "1"
          python .\scripts\validate-project.py --root . --kind rules --report-only
          python .\scripts\sync_global_agents.py --check --report-only
          python .\scripts\plan_migration.py --plan --target global --report-only
      - name: Bootstrap regression test with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-bootstrap.ps1
      - name: Project contract parity test with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-contract.ps1
      - name: Agent setup smoke test with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-agent-setup.ps1
      - name: Agent skill contract test with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-skills.ps1
      - name: Bootstrap regression test with PowerShell 7
        shell: pwsh
        run: .\scripts\test-bootstrap.ps1
      - name: Project contract parity test with PowerShell 7
        shell: pwsh
        run: .\scripts\test-contract.ps1
      - name: Agent setup smoke test with PowerShell 7
        shell: pwsh
        run: .\scripts\test-agent-setup.ps1
      - name: Agent skill contract test with PowerShell 7
        shell: pwsh
        run: .\scripts\test-skills.ps1
      - name: PowerShell test environment isolation
        shell: powershell
        run: .\scripts\test-powershell-environment.ps1
      - name: PowerShell wrapper discovery test with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test-powershell-wrappers.ps1
      - name: PowerShell wrapper discovery test with PowerShell 7
        shell: pwsh
        run: .\scripts\test-powershell-wrappers.ps1

  # `powershell` is a required status check, and a matrix would have renamed it
  # to `powershell (1)`, `powershell (2)`... — branch protection would then rest
  # on a context that no longer exists. The neighbouring repository broke its
  # own protection exactly that way. So the name stays on a job that produces
  # it, and that job is the verdict of the two above.
  powershell:
    if: always()
    needs: [windows-suite, windows-native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve the required Windows check
        run: |
          echo "windows-suite: ${{ needs.windows-suite.result }}"
          echo "windows-native: ${{ needs.windows-native.result }}"
          test "${{ needs.windows-suite.result }}" = "success"
          test "${{ needs.windows-native.result }}" = "success"

  cross-repo-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: NightMadMax/best-practices
          ref: 56c51c014751035a84054e4468c7babc560c637b
          path: .external/best-practices
          persist-credentials: false
      # `bash` on every platform, including Windows: the default there is
      # `pwsh -command`, which returns the code of the last line only. The
      # contract check could fail and the job stay green — and this job is a
      # required check, so branch protection would rest on a step that cannot
      # go red. The Windows suite avoids the same trap by running one command
      # whose exit code is the whole shard's verdict; here the shell fixes it.
      - name: Verify pinned checkout and consumer E2E
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -e
          python scripts/check_best_practices_contract.py --best-practices-root .external/best-practices
          python scripts/test-best-practices-e2e.py --best-practices-root .external/best-practices
