name: governance-audit

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify rulesets and sole owner-admin invariant
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/check_github_governance.py
          --repository NightMadMax/new-project-rules
          --github-token-scope
